name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: python3 scripts/package.py --output "dist/ragnacustoms-vote-${GITHUB_REF_NAME#v}.rmod"
      - name: Verify package
        run: python3 scripts/verify_release.py --package "dist/ragnacustoms-vote-${GITHUB_REF_NAME#v}.rmod"
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rmod
